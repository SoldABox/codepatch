name: Continuous security capacity audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuous-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-audit:
    name: Repository security score
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic repository audit
        run: |
          python security_audit.py \
            --minimum-score 100 \
            --output audit-results/repository-security.json
      - uses: actions/upload-artifact@v4
        with:
          name: repository-security-audit
          path: audit-results/repository-security.json
          if-no-files-found: error
          retention-days: 90

  dependency-audit:
    name: Dependency vulnerability and SBOM audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-security.txt
      - name: Install audit tooling
        run: python -m pip install --disable-pip-version-check pip-audit
      - name: Audit declared dependencies
        run: |
          mkdir -p audit-results
          python -m pip_audit \
            --requirement requirements-security.txt \
            --format json \
            --output audit-results/dependency-audit.json
      - name: Generate CycloneDX SBOM
        run: |
          python -m pip_audit \
            --requirement requirements-security.txt \
            --format cyclonedx-json \
            --output audit-results/sbom.cdx.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-and-sbom
          path: audit-results/
          if-no-files-found: warn
          retention-days: 90

  large-capacity-benchmark:
    name: 64 MiB capacity and recovery benchmark
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-security.txt
      - name: Install cryptography
        run: python -m pip install --disable-pip-version-check -r requirements-security.txt
      - name: Run large-capacity benchmark
        run: |
          python benchmarks/benchmark_file_vault.py \
            --size-mib 64 \
            --files 256 \
            --runs 3 \
            --max-protect-seconds 90 \
            --max-decrypt-seconds 90 \
            --output audit-results/file-vault-64mib.json
      - uses: actions/upload-artifact@v4
        with:
          name: large-capacity-benchmark
          path: audit-results/file-vault-64mib.json
          if-no-files-found: error
          retention-days: 90
