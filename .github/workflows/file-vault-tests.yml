name: File vault security tests

on:
  push:
    paths:
      - "file_vault.py"
      - "requirements-security.txt"
      - "tests/test_file_vault.py"
      - ".github/workflows/file-vault-tests.yml"
  pull_request:
    paths:
      - "file_vault.py"
      - "requirements-security.txt"
      - "tests/test_file_vault.py"
      - ".github/workflows/file-vault-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install security dependency
        run: python -m pip install -r requirements-security.txt
      - name: Compile security module
        run: python -m py_compile file_vault.py
      - name: Run file vault tests
        run: python -m unittest tests.test_file_vault -v
