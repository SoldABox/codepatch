name: File vault security and benchmark gates

on:
  push:
    paths:
      - "file_vault.py"
      - "requirements-security.txt"
      - "tests/**"
      - "benchmarks/**"
      - ".github/workflows/file-vault-tests.yml"
  pull_request:
    paths:
      - "file_vault.py"
      - "requirements-security.txt"
      - "tests/**"
      - "benchmarks/**"
      - ".github/workflows/file-vault-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file-vault-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-security.txt
      - name: Install security dependency
        run: python -m pip install --disable-pip-version-check -r requirements-security.txt
      - name: Compile all security modules
        run: python -m compileall -q file_vault.py warcraft3_protector.py benchmarks tests
      - name: Run complete unit and adversarial suite
        run: python -m unittest discover -s tests -v
      - name: Reject accidental vaults or secrets in tracked files
        shell: bash
        run: |
          if git ls-files | grep -E '(\.cpvault$|\.p12$|\.pfx$|\.kdbx$|(^|/)\.env($|\.))'; then
            echo "Sensitive generated or secret file is tracked."
            exit 1
          fi
      - name: Verify CLI help surfaces
        run: |
          python file_vault.py --help
          python file_vault.py protect --help
          python file_vault.py verify --help
          python file_vault.py decrypt --help

  benchmark:
    name: Performance and recovery benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-security.txt
      - name: Install security dependency
        run: python -m pip install --disable-pip-version-check -r requirements-security.txt
      - name: Run repeatable 8 MiB benchmark
        run: |
          python benchmarks/benchmark_file_vault.py \
            --size-mib 8 \
            --files 32 \
            --runs 3 \
            --max-protect-seconds 30 \
            --max-decrypt-seconds 30 \
            --output benchmark-results/file-vault.json
      - uses: actions/upload-artifact@v4
        with:
          name: file-vault-benchmark
          path: benchmark-results/file-vault.json
          if-no-files-found: error
          retention-days: 30
