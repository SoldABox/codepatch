name: Warcraft III protection tests

on:
  push:
    paths:
      - "warcraft3_protector.py"
      - "tests/test_warcraft3_protector.py"
      - ".github/workflows/warcraft3-protection-tests.yml"
  pull_request:
    paths:
      - "warcraft3_protector.py"
      - "tests/test_warcraft3_protector.py"
      - ".github/workflows/warcraft3-protection-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile module
        run: python -m py_compile warcraft3_protector.py
